services:
  - type: web
    name: iot-monitoring-backend
    env: python
    rootDir: backend
    buildCommand: "bash build.sh"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: iot-monitoring-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

  - type: web
    name: iot-monitoring-frontend
    env: static
    rootDir: frontend
    buildCommand: ""
    staticPublishPath: "./"

databases:
  - name: iot-monitoring-db
    databaseName: iot_db
    user: iot_user
